<title>VPĐK Tam Dương</title>

<style>
/* Bố cục: thanh trên cùng (tên đơn vị + 3 mục), phía dưới là vùng làm việc của từng công cụ */
:root{--bg:#f3f6f7;--surface:#ffffff;--ink:#13222c;--muted:#5a6b76;--line:#d5dee3;--accent:#0b5a6b;--accent-ink:#ffffff;--tab-hover:#e8eef0;
--sans:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--surface:#17252d;--ink:#e6eef1;--muted:#93a6b0;--line:#2a3c46;--accent:#5fc1d4;--accent-ink:#0a1a20;--tab-hover:#1f323b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a20;--surface:#17252d;--ink:#e6eef1;--muted:#93a6b0;--line:#2a3c46;--accent:#5fc1d4;--accent-ink:#0a1a20;--tab-hover:#1f323b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:8px 0;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0;padding-block:2px 8px}
.logo{width:40px;height:40px;border-radius:9px;flex:none;display:block}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:1.05rem;font-weight:700;letter-spacing:.01em;color:var(--accent)}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.nav button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
.nav button:hover{background:var(--tab-hover);color:var(--ink)}
.nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative}
.mod{position:absolute;inset:0;overflow:auto}
.mod[hidden]{display:none}
@media (max-width:640px){.nav{margin-left:0;width:100%}.brand span{white-space:normal}}
/* hộp thoại thay cho alert / confirm / prompt */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,20,26,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg[hidden]{display:none}
.dlg form{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,100%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg p{margin:0;white-space:pre-wrap;line-height:1.5;font-size:.92rem}
.dlg input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg button{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:none;color:var(--accent)}
.dlg button.ok{background:var(--accent);color:var(--accent-ink)}
</style>

<script>
/* ---------- hộp thoại dùng chung (trình xem không hiện alert/confirm/prompt) ---------- */
function uiDialog(o){
  return new Promise(function(res){
    var f=document.getElementById('dlg'),box=f.firstElementChild;box.textContent='';
    var p=document.createElement('p');p.textContent=o.msg;box.appendChild(p);
    var inp=null;if(o.input){inp=document.createElement('input');inp.type='text';inp.id='dlgIn';inp.setAttribute('aria-label',o.msg);box.appendChild(inp)}
    var row=document.createElement('div');row.className='row';
    function done(v){f.hidden=true;f.onsubmit=null;f.onkeydown=null;res(v)}
    if(o.cancel){var c=document.createElement('button');c.type='button';c.textContent='Hủy';c.onclick=function(){done(null)};row.appendChild(c)}
    var k=document.createElement('button');k.type='submit';k.className='ok';k.textContent=o.ok||'Đồng ý';row.appendChild(k);box.appendChild(row);
    f.onsubmit=function(e){e.preventDefault();done(inp?inp.value:true)};
    f.onkeydown=function(e){if(e.key==='Escape')done(o.cancel?null:true)};
    f.hidden=false;(inp||k).focus();
  });
}
function uiAlert(m){return uiDialog({msg:m,ok:'Đã hiểu'}).then(function(){})}
function uiConfirm(m){return uiDialog({msg:m,cancel:true}).then(function(v){return v===true})}
function uiPrompt(m){return uiDialog({msg:m,input:true,cancel:true}).then(function(v){return typeof v==='string'?v:null})}

/* ---------- 1. Hồ sơ BPKT ---------- */
function mountBpkt(root){
/* ===================== ĐỌC FILE EXCEL (xlsx, xlsm, xls, ods, csv, tsv, html) ===================== */
const MAXCOL = 70;   // chỉ đọc tối đa 70 cột đầu của mỗi sheet

function xmlDecode(s) {
  return s.replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function attrs(s) { const o = {}; s.replace(/([\w:.-]+)\s*=\s*"([^"]*)"/g, (_, k, v) => { o[k] = v; return ''; }); return o; }
function colLetters(s) { let n = 0; for (let i = 0; i < s.length; i++) n = n * 26 + s.charCodeAt(i) - 64; return n - 1; }
function finishRows(map, maxRow) {            // map: Map<row, Map<col,val>> -> mảng 2 chiều
  const rows = [];
  for (let r = 0; r <= maxRow; r++) {
    const m = map.get(r); if (!m) { rows.push([]); continue; }
    let mx = -1; m.forEach((_, c) => { if (c > mx) mx = c; });
    const arr = new Array(mx + 1).fill('');
    m.forEach((v, c) => arr[c] = v); rows.push(arr);
  }
  return rows;
}

// ---------- XLSX / XLSM ----------
async function readXlsx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const txt = async p => { const f = zip.file(p); return f ? await f.async('string') : ''; };
  const wbx = await txt('xl/workbook.xml');
  if (!wbx) throw new Error('Không phải file xlsx hợp lệ');
  const relx = await txt('xl/_rels/workbook.xml.rels');
  const rels = {}; (relx.match(/<Relationship\b[^>]*>/g) || []).forEach(t => { const a = attrs(t); rels[a.Id] = a.Target; });
  const sst = []; const sx = await txt('xl/sharedStrings.xml');
  if (sx) (sx.match(/<si\b[\s\S]*?<\/si>|<si\s*\/>/g) || []).forEach(si => {
    const clean = si.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
    let out = ''; clean.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (_, t) => { out += t; return ''; });
    sst.push(xmlDecode(out));
  });
  const sheets = [];
  const defs = wbx.match(/<sheet\b[^>]*>/g) || [];
  for (const d of defs) {
    const a = attrs(d); let tgt = rels[a['r:id']]; if (!tgt) continue;
    tgt = tgt.replace(/^\/?(xl\/)?/, 'xl/');
    const xml = await txt(tgt); const map = new Map(); let maxRow = -1;
    const re = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
    while ((m = re.exec(xml))) {
      const at = m[1], body = m[2]; if (!body) continue;
      const rm = at.match(/\br="([A-Z]+)(\d+)"/); if (!rm) continue;
      const c = colLetters(rm[1]); if (c >= MAXCOL) continue;
      const r = +rm[2] - 1, tm = at.match(/\bt="(\w+)"/), t = tm ? tm[1] : 'n';
      let val = '';
      if (t === 'inlineStr') { let o = ''; body.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (_, x) => { o += x; return ''; }); val = xmlDecode(o); }
      else { const vm = body.match(/<v>([\s\S]*?)<\/v>/); if (!vm) continue;
        if (t === 's') val = sst[+vm[1]] || ''; else if (t === 'str') val = xmlDecode(vm[1]);
        else if (t === 'e') val = ''; else if (t === 'b') val = vm[1] === '1' ? 'TRUE' : 'FALSE';
        else { val = parseFloat(vm[1]); if (isNaN(val)) val = xmlDecode(vm[1]); } }
      if (val === '') continue;
      let row = map.get(r); if (!row) { row = new Map(); map.set(r, row); }
      row.set(c, val); if (r > maxRow) maxRow = r;
    }
    sheets.push({ name: xmlDecode(a.name), rows: finishRows(map, maxRow), hidden: a.state === 'hidden' });
  }
  return sheets;
}

// ---------- ODS ----------
async function readOds(buf) {
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('content.xml'); if (!f) throw new Error('Không phải file ods hợp lệ');
  const xml = await f.async('string'); const sheets = [];
  const parts = xml.split(/<table:table\s/).slice(1);
  for (let part of parts) {
    const end = part.indexOf('</table:table>'); if (end >= 0) part = part.slice(0, end);
    const name = xmlDecode((part.match(/table:name="([^"]*)"/) || [, 'Sheet'])[1]);
    const map = new Map(); let r = 0, maxRow = -1;
    const rowRe = /<table:table-row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/table:table-row>)/g; let rm;
    while ((rm = rowRe.exec(part))) {
      const ra = attrs(rm[1]), rep = +(ra['table:number-rows-repeated'] || 1), body = rm[2] || '';
      const cells = new Map(); let c = 0;
      const cellRe = /<table:(covered-)?table-cell\b([^>]*?)(?:\/>|>([\s\S]*?)<\/table:(?:covered-)?table-cell>)/g; let cm;
      while ((cm = cellRe.exec(body))) {
        const ca = attrs(cm[2]), crep = +(ca['table:number-columns-repeated'] || 1), vt = ca['office:value-type'];
        let val = '';

async function checkWatch() {

      if (f.lastModified !== src.lastModified) { await loadFile(f, src.handle); changed = true; }

}
async function reconnect() {
  for (const src of ST.sources) if (src.handle) { try { if ((await src.handle.requestPermission({ mode: 'read' })) === 'granted') src.watch = true; } catch (e) {} }
  ST.needPerm = false; await checkWatch(); render();
}
async function restore() {
  await DB.open();
  try { ST.opts = { ...ST.opts, ...JSON.parse(localStorage.getItem('qlhs.opts') || '{}') }; } catch (e) {}
  const saved = await DB.all();

const GD = Object.assign({ url: '', key: '', link: '', id: '', every: 2, on: false, mod: 0, last: 0, status: '', busy: false }, (() => { try { return JSON.parse(localStorage.getItem('qlhs.gd') || '{}'); } catch (e) { return {}; } })());
GD.busy = false;
const gdSave = () => { try { localStorage.setItem('qlhs.gd', JSON.stringify({ url: GD.url, key: GD.key, link: GD.link, id: GD.id, every: GD.every, on: GD.on, mod: GD.mod })); } catch (e) {} };
function gdId(s) { s = String(s || '').trim(); const m = s.match(/\/d\/([\w-]{20,})/) || s.match(/[?&]id=([\w-]{20,})/) || s.match(/^([\w-]{20,})$/); return m ? m[1] : ''; }
async function gdCall(params) {
  const q = new URLSearchParams(Object.assign({ key: GD.key, id: GD.id }, params)).toString();
  const viaPy = /^https?:$/.test(location.protocol) && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const r = viaPy ? await fetch('/api/drive?base=' + encodeURIComponent(GD.url) + '&' + q)
                  : await fetch(GD.url + (GD.url.includes('?') ? '&' : '?') + q, { redirect: 'follow' });
  if (!r.ok) throw new Error('máy chủ trả về mã ' + r.status);
  let j; try { j = await r.json(); } catch (e) { throw new Error('phản hồi không phải dữ liệu hợp lệ – kiểm tra lại đường dẫn Web App và quyền "Bất kỳ ai"'); }
  if (j.error) throw new Error(j.error === 'unauthorized' ? 'mật khẩu cầu nối không đúng' : j.error);
  return j;
}
async function syncDrive(force) {
  if (GD.busy) return; if (!GD.url || !GD.id) { GD.status = 'Chưa nhập đủ thông tin kết nối.'; return render(); }
  GD.busy = true; GD.status = 'Đang kiểm tra Google Drive…'; if (S.tab === 'src') render();
  try {
    const meta = await gdCall({ action: 'meta' });
    if (!force && meta.modified === GD.mod && ST.sources.some(s => s.fromDrive)) { GD.status = 'Không có thay đổi · kiểm tra lúc ' + new Date().toLocaleTimeString('vi-VN'); }
    else {
      GD.status = 'Đang tải "' + meta.name + '"…'; if (S.tab === 'src') render();
      const full = await gdCall({ action: 'get' }), bin = atob(full.data), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const f = new File([u8], full.name, { lastModified: full.modified });
      await loadFile(f, null); const s = ST.sources.find(x => x.name === full.name); if (s) s.fromDrive = true;
      GD.mod = full.modified; gdSave(); GD.status = 'Đã cập nhật từ Drive lúc ' + new Date().toLocaleTimeString('vi-VN') + ' (file sửa lúc ' + new Date(full.modified).toLocaleString('vi-VN') + ')';
    }
    GD.last = Date.now();
  } catch (e) { GD.status = 'Lỗi: ' + (e && e.message || e); }
  GD.busy = false; setLive('ok'); render();
}

// ---------- xuất CSV ----------
async function csvDownload(name, rows) {
  const t = '\uFEFF' + rows.map(r => r.map(v => { v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  if (window.claude && claude.use) {
    try { const dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: t }); return; } }
    catch (e) { if (e && e.code !== 'unavailable') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportTon() {
  csvDownload('ho-so-ton.csv', [['Xã', 'Địa bàn', 'Mã hồ sơ', 'Tên', 'Tờ', 'Thửa', 'SĐT', 'Cán bộ', 'Loại thủ tục', 'Ngày nhận', 'Số ngày tồn', 'Nguồn']].concat(tonList().map(({ r, days }) => [r.xa, r.dia, r.ma, r.ten, r.to, r.thua, r.sdt, cbName(r), r.loai, vn(r.nhan), days == null ? '' : days, r.src + ' · dòng ' + r.row])));
}
function exportNd() {
  csvDownload('ho-so-khong-co-ngay-nhan-rut.csv', [['Xã', 'Mã hồ sơ', 'Tên', 'Tờ', 'Thửa', 'SĐT', 'Cán bộ', 'Nguồn', 'Hồ sơ trùng (nếu có)']].concat(DATA.noDate.map(x => [x.r.xa, x.r.ma, x.r.ten, x.r.to, x.r.thua, x.r.sdt, cbName(x.r), x.r.src + ' · dòng ' + x.r.row, x.m ? x.m.src + ' · dòng ' + x.m.row : ''])));
}
function exportCb() {
  const P = span(S.ref, S.unit), X = xas(), list = recs().filter(inXa), cbs = [...new Set(list.map(cbName))].sort((a, b) => a.localeCompare(b, 'vi'));
  csvDownload('theo-can-bo-' + P.s + '.csv', [['Cán bộ', 'Số nhận', 'Đã trình trong kỳ', 'Tồn cuối kỳ'].concat(X.map(x => 'Tồn ' + x))].concat(cbs.map(c => { const l = list.filter(r => cbName(r) === c), s = pstat(l, P.s, P.e); return [c, s.a, s.b, s.c].concat(X.map(x => pstat(l.filter(r => r.xa === x), P.s, P.e).c)); })));
}

    GD.on = true; GD.mod = 0; gdSave(); syncDrive(true);
  }
  else if (a === 'csvNd') exportNd(); else if (a === 'csvTon') exportTon(); else if (a === 'csvCb') exportCb(); else if (a === 'csvDia') exportDia();
  else if (a === 'map') { S.open[t.dataset.k] = !S.open[t.dataset.k]; render(); }
  else if (a === 'reconnect') reconnect();
  else if (a === 'remove') { const s = srcOf(t); if (await uiConfirm('Gỡ file "' + s.name + '" khỏi công cụ? (file gốc không bị xóa)')) { ST.sources = ST.sources.filter(x => x !== s); DB.del(s.name); rebuild(); setLive('ok'); } }
  else if (a === 'reload') { const s = srcOf(t); if (s.handle) s.handle.getFile().then(f => loadFile(f, s.handle)).catch(() => uiAlert('Không đọc được file. Hãy nạp lại file bằng nút "Nạp file Excel".')); else uiAlert('File này nạp thủ công. Hãy bấm "Nạp file Excel" và chọn lại file đã sửa.'); }
  else if (a === 'redetect') { const s = srcOf(t), sh = s.sheets[+t.dataset.hi], auto = detectSheet(sh.rows); sh.cfg = { ...auto, xa: sh.cfg.xa, include: sh.cfg.include }; saveCfg(s); persist(s); rebuild(); }
});
root.addEventListener('change', async e => {
  const t = e.target; if (t.id === 'fileInput') { [...t.files].reduce((p, f) => p.then(() => loadFile(f, null)), Promise.resolve()); t.value = ''; return; }
  const a = t.dataset && t.dataset.act; if (!a || !['inc', 'xa', 'he', 'col'].includes(a)) return;
  const s = srcOf(t), sh = s.sheets[+t.dataset.hi], c = sh.cfg;

const MAXC=60000;
function fileText(f){return new Promise((res,rej)=>{const n=norm(f.name);

else if(/\.(txt|md|csv|json|html?|xml)$/.test(n)){const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsText(f)}
else rej(new Error("type"))})}

if(f.type.startsWith("image/")){if(lim&&lim.images){uploads.push({name:f.name,img:f})}else note.textContent="Chưa gửi được ảnh: "+f.name;continue}
try{const t=await fileText(f);uploads.push({name:f.name,text:t.slice(0,MAXC)});if(t.length>MAXC)note.textContent="Một số tài liệu dài, chỉ dùng "+MAXC.toLocaleString("vi-VN")+" ký tự đầu."}

function lsUndo(u){const go=r=>{if(r.list){r.list.forEach(go);return}if(r.op==='ins'||r.op==='del'){if(r.t==='DaMucDichSuDung'&&r.tid!=null)lsQueue([r.tid],'kh');return}const k=LS_COL[r.col];if(k)try{lsQueue(gtpTids(r.t,r.id),k)}catch(e){}};go(u)}

// tách chữ nhãn của thửa thành số thửa / diện tích / ký hiệu theo đúng cách thParse đọc nhãn, giữ vị trí trong chuỗi để thay đúng chỗ
function lsToks(f){const T=[];
 for(const t of f.lab){const s=t.p.s,re=/(\d+(?:[.,]\d+)?)\s*(?:m2|m²|M2|M²)|(\d+[.,]\d+)|(\d+)|([A-ZĐ]{2,4}(?:\s*[+\/]\s*[A-ZĐ]{2,4})*)/g;let m;
  while((m=re.exec(s))){const a=m.index;if(m[1]!=null)T.push({t,k:'d',a,b:a+m[1].length,v:m[1],y:t.cy});else T.push({t,k:m[2]!=null?'d':m[3]!=null?'i':'c',a,b:a+m[0].length,v:m[0],y:t.cy})}}
 const Dd=T.filter(z=>z.k==='d').map(z=>({...z,n:+z.v.replace(',','.')})),I=T.filter(z=>z.k==='i').map(z=>({...z,n:+z.v})),C=T.filter(z=>z.k==='c');let dt=null;
 if(Dd.length){Dd.sort((a,b)=>Math.abs(a.n-f.a)-Math.abs(b.n-f.a));dt=Dd[0]}
 else if(I.length>=2){const c=I.slice().sort((a,b)=>Math.abs(a.n-f.a)-Math.abs(b.n-f.a))[0];if(Math.abs(c.n-f.a)<=Math.max(2,f.a*.1)){dt=c;I.splice(I.indexOf(c),1)}}

// diện tích ghi như chữ nhãn đang có: cùng số chữ số thập phân, cùng dấu (chấm / phẩy); nhãn mới: 1 chữ số thập phân như 🏷 Vẽ nhãn
function lsFmtDt(v,tok){const s=tok?tok.v:'',m=s.match(/[.,](\d+)$/),dec=m?m[1].length:tok?0:1,sep=/,/.test(s)?',':'.';return(+v).toFixed(dec).replace('.',sep)}
// một dòng chữ mới cùng kiểu với dòng q (lớp, màu, cỡ, góc, phông), cách dòng q đúng 1,4 lần cao chữ (dir = +1 phía trên, −1 phía dưới)
function lsLine(s,q,dir){const p=q.p,h=p.h,r=p.r||0,c=Math.cos(r),sn=Math.sin(r),w=twid({s,h,tw:null}),off=h*1.4*dir,ccx=q.cx-sn*off,ccy=q.cy+c*off;
 return{id:newId(),k:'T',lv:p.lv,c:p.c,w,st:0,x:ccx-w/2*c+h*.45*sn,y:ccy-w/2*sn-h*.45*c,h,r,s,font:p.font||0}}
// thửa chưa có chữ nhãn: vẽ nhãn như 🏷 Vẽ nhãn (số thửa / diện tích / loại đất ở chỗ rộng nhất trong thửa)
function lsNewLab(f,lines){const LL=TCFG.llv.length?TCFG.llv[0]:13,cc={};for(const p of M.prims)if(p.k==='T'&&p.lv===LL)cc[p.c]=(cc[p.c]||0)+1;let c0=0,cm=0;for(const k in cc)if(cc[k]>cm){cm=cc[k];c0=+k}
 const ip=thIP(f),nl=lines.length;let hh=TCFG.hc*1000;const room=(f.ipd||0)*1.6;if(room>0&&hh*nl*1.4>room)hh=Math.max(300,room/(nl*1.4));hh=Math.round(hh);

// các bước sửa chữ để nhãn của thửa f ghi đúng w = {so, dt, kh} (chỉ các mục trong K)
function lsOps(f,w,K){const tk=lsToks(f),R=new Map(),ops=[],add=[],miss={};
 const rep=(z,s)=>{let a=R.get(z.t.p);if(!a)R.set(z.t.p,a=[]);a.push([z.a,z.b,s])};
 if(K.has('so')&&w.so){if(tk.so){if(lsNo(tk.so.v)!==lsNo(w.so))rep(tk.so,w.so)}else miss.so=w.so}
 if(K.has('dt')&&w.dt!=null&&w.dt>0){const s=lsFmtDt(w.dt,tk.dt);if(tk.dt){if(tk.dt.v!==s)rep(tk.dt,s)}else miss.dt=s}

 for(const[p,L]of R){L.sort((a,b)=>b[0]-a[0]);let s=p.s;for(const[a,b,t]of L)s=s.slice(0,a)+t+s.slice(b);if(s===p.s)continue;
  const dl=(twid(p)-twid({s,h:p.h,tw:null}))/2,c=Math.cos(p.r||0),sn=Math.sin(p.r||0);ops.push({t:'t',id:p.id,s0:p.s,s1:s,h0:p.h,h1:p.h});if(Math.abs(dl)>.5)ops.push({t:'m',ids:[p.id],dx:dl*c,dy:dl*sn})}

  if(!L.length){const so=w.so||'';if(so)add.push(...lsNewLab(f,[so,w.dt>0?lsFmtDt(w.dt,null):fmt1(f.a)].concat(w.kh?[w.kh]:[])))}

// .gtp → nhãn: chạy sau khi sửa xong (gộp các ô sửa trong cùng một lần bấm)
function lsFlush(){const Q=[...lsQ];lsQ.clear();const G=GTP;if(!G||!M||!PARC||!G.face||!Q.length)return;const F=new Set(PARC.F),ops=[],add=[],nm=[];
 for(const[tid,K]of Q){const x=G.byId.get(tid);if(!x||!x.f||!F.has(x.f))continue;const f=x.f,v=x.v,w={so:lsNo(v.soThuTuThua),dt:+v.dienTich>0?+v.dienTich:null,kh:gtpKhOf(f)||gtpKhOf(f,true)||''};

 const s0=$('st').textContent.replace(/ · đã sửa nhãn thửa.*$/,'');st(s0+` · đã sửa nhãn thửa ${nm.join(', ')} trên bản đồ theo .gtp (↶ của bản đồ để hoàn tác nhãn)`)}
// ký hiệu loại đất vào .gtp: cột ký hiệu thửa; thửa một loại đất thì đổi luôn loại đất chi tiết (như chọn ở bảng chi tiết)

 if(k.length===1&&md.length===1&&G.T.DaMucDichSuDung&&G.T.DaMucDichSuDung.cols.includes('loaiMucDichSuDungKiemKeId')){const r=md[0],n=GTP_LD_RID[k[0]];

// nhãn → .gtp: chỉ mục trên nhãn thật sự đổi (old: số / diện tích / ký hiệu đọc được trước khi sửa)
function lsToGtp(x,f,old){const v=x.v,ch=[],X=()=>GTP.byId.get(x.id)||x;let err='';
 const so=String(f.so0||'').trim();if(so&&f.sos&&f.sos.length===1&&lsNo(so)!==lsNo(old.so)&&lsNo(so)!==lsNo(v.soThuTuThua)){try{if(gtpSet('ThuaDat',x.id,'soThuTuThua',so))ch.push('số thửa '+so)}catch(e){err=e.message}}

// các chữ trên lớp nhãn bị bước sửa op chạm tới (chỉ bước người dùng sửa / đặt chữ, có cờ ls)
function lsIds(op,rev,out,ls){ls=ls||!!op.ls;if(op.t==='g'){for(const o of op.ops)lsIds(o,rev,out,ls);return out}

 for(const id of ids){const p=M.byId.get(id);if(!p||p.k!=='T'||!LL.has(p.lv))continue;const w=twid(p),c=Math.cos(p.r||0),s=Math.sin(p.r||0),cx=p.x+w/2*c-p.h*.45*s,cy=p.y+w/2*s+p.h*.45*c,f0=thAt(cx,cy),x0=thGx(f0);

 st(s0+(done.length?` · đã ghi vào .gtp: ${done.map(r=>'thửa '+r.so+' ('+r.ch.join(', ')+')').join('; ')} (↶ ở 📋 Bảng thuộc tính để hoàn tác)`:'')+(errs.length?' · ⚠ .gtp chưa ghi: '+errs[0]:''))}
// ⓘ Thông tin thửa → ✎ Sửa → 💾 Lưu: số thửa / loại đất của thửa đã nối .gtp ghi vào .gtp (nhãn tự đổi theo); thửa chưa nối .gtp thì sửa chữ nhãn
// trả về số thửa / loại đất cần giữ làm “điền tay” (null = không điền tay)
function lsForm(f,soIn,ldIn){if(PARC&&!PARC.F.includes(f))f=thAt(...thIP(f))||f;const x=thGx(f),nz=lsNz;

  for(const k of cl){const g=cluster(k.b,k.m);let sx=1,ox=0,adv=g.w;pre+=k.s;
   if(mw){const nx=mw(pre.normalize('NFC'));adv=Math.max(0,nx-px);px=nx;
    if(g.w>0&&adv>0){sx=Math.max(.55,Math.min(1.6,adv/g.w));ox=(adv-g.w*sx)/2}}
   for(const s of g.st)out.push(s.map(([a,b])=>[x+ox+a*sx,b]));x+=adv}
  return{w:x,st:out,n:cl.length}}

/* ===== Phiếu PL17 → DGN V7 =====
   REC: các phần tử do thHoso ghi lại khi vẽ phiếu (toạ độ "pt" của trang rộng 612, trục y hướng xuống) + REC.geo (phép đặt trang lên bản đồ).
   Cả tờ phiếu được đặt lên toạ độ bản đồ: sơ đồ thửa (ranh, ranh liền kề, mốc đỉnh) dùng đúng toạ độ gốc, phần còn lại co theo tỷ lệ 1:N.
   Đơn vị chính m, phụ mm (như bản đồ địa chính); gốc toàn cục ở mét chẵn gần tâm sơ đồ để toạ độ 32 bit đủ chỗ (mặc định 1 UOR = 1 µm).
   Level 1 khung/bảng, 2 chữ, 3 ranh thửa, 4 đỉnh thửa, 5 nhãn thửa (mỗi nhãn một nhóm đồ họa), 6 khung in.
   Chữ mặc định là nét vector (có đủ dấu tiếng Việt, hiện đúng trên mọi máy); opt.ascii = chữ không dấu dạng TEXT sửa được.
   opt.wd(chuỗi, sz, đậm, nghiêng) → độ rộng (pt) theo phông Times của trang, để chữ nét khớp bước chữ của PDF. */

 const G=REC.geo,o=G.org||[0,0],ps=1/G.sc,FRM=pl17Frames(G,FS),FE=pl17Ext(FRM),half=Math.hypot(FE[1]-FE[0],FE[3]-FE[2]+40)*ps,upm=[1000,100,10,1].find(q=>half*q<2e9)||1;
 const GO=[-Math.round((G.cx-o[0])/1000)*upm*1000,-Math.round((G.cy-o[1])/1000)*upm*1000];
 const UX=x=>(x-o[0])*upm+GO[0],UY=y=>(y-o[1])*upm+GO[1],WX=u=>G.cx+(u-G.mx)*ps,WY=v=>G.cy-(v-G.my)*ps,X=u=>UX(WX(u)),Y=v=>UY(WY(v)),K=ps*upm;
 const LV={KHUNG:1,CHU:2,SODO:3,DINH:4,MOC:4,NHAN:5,KHUNGIN:6},wl=w=>w<=.25?0:w<=.5?1:w<=.8?2:3,els=[],CAP=.662,MID=.3375;let gg=0,ch=null,cg=null;
 const fold=t=>String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/²/g,'2').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7e]/g,'?');

 const flush=()=>{if(!ch)return;const p=ch.p,cl=p.length>2&&Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1])<.01;

   Level 1 KHUNG PHIEU, 2 CHU PHIEU, 3 RANH THUA, 4 DINH THUA, 5 NHAN THUA (mỗi nhãn là một cell có tên, chữ trong cell vẫn sửa được), 6 KHUNG IN.

 for(const f of FRM){put({t:'P',g:[WX(f.u0),WY(f.v0),WX(f.u1),WY(f.v0),WX(f.u1),WY(f.v1),WX(f.u0),WY(f.v1)],ly:'KHUNGIN',wt:0,col:3});put({t:'T',s:f.note,x:f.u0,y:f.v1+16,sz:f.nsz/FS,al:'left',ly:'KHUNGIN',col:3})}flush();

  }

})();
